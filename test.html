let yaw = 0;
let pitch = 0;

let mouseDown = false;

document.addEventListener("mousedown", () => {
    mouseDown = true;
});

document.addEventListener("mouseup", () => {
    mouseDown = false;
});
document.addEventListener("mousemove",(event)=>{

    if(mouseDown){

        yaw -= event.movementX * 0.002;
        pitch -= event.movementY * 0.002;

        pitch = Math.max(
            -Math.PI/2,
            Math.min(Math.PI/2,pitch)
        );

        camera.rotation.order = "YXZ";

        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
    }

});

const loader = new THREE.TextureLoader();


//////////////////////////////////////////////////////////////////////////////
// KUBUS OPBOUWEN VANUIT DE 6 FOTOVLAKKEN
//////////////////////////////////////////////////////////////////////////////

function buildCube(pano,size=1){

    const cube = new THREE.Group();

    cube.name = pano.id;
    cube.userData = pano;

    const faces = [

        {
            file:"front.jpg",
            position:[0,0,size/2],
            rotation: [pano.fotoQuaternions.qx1,pano.fotoQuaternions.qy1,pano.fotoQuaternions.qz1,pano.fotoQuaternions.qw1]
        },

        {
            file:"right.jpg",
            position:[size/2,0,0],
            rotation:[pano.fotoQuaternions.qx2,pano.fotoQuaternions.qy2,pano.fotoQuaternions.qz2,pano.fotoQuaternions.qw2]
        },

        {
            file:"back.jpg",
            position:[0,0,-size/2],
            rotation:[pano.fotoQuaternions.qx3,pano.fotoQuaternions.qy3,pano.fotoQuaternions.qz3,pano.fotoQuaternions.qw3]
        },

        {
            file:"left.jpg",
            position:[-size/2,0,0],
            rotation:[pano.fotoQuaternions.qx4,pano.fotoQuaternions.qy4,pano.fotoQuaternions.qz4,pano.fotoQuaternions.qw4]
        },

        {
            file:"top.jpg",
            position:[0,size/2,0],
            rotation:[pano.fotoQuaternions.qx5,pano.fotoQuaternions.qy5,pano.fotoQuaternions.qz5,pano.fotoQuaternions.qw5]
        },

        {
            file:"bottom.jpg",
            position:[0,-size/2,0],
            rotation:[pano.fotoQuaternions.qx6,pano.fotoQuaternions.qy6,pano.fotoQuaternions.qz6,pano.fotoQuaternions.qw6]
        }

    ];

    faces.forEach(face=>{

        const url =
			pano.folder + "/" + face.file;

		console.log(url);

		const texture = loader.load(
			url,
			() => console.log("geladen:", url),
			undefined,
			err => console.error("fout:", url, err)
			);

        const material =
            new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.FrontSide
            });

        const mesh =
            new THREE.Mesh(
                new THREE.PlaneGeometry(size,size),
                material
            );
		
		//start met een E57 quaternion breedt-diepte-hoogte
		const faceQuaternionE57 = new THREE.Quaternion(
			face.rotation[0],
			face.rotation[1],
			face.rotation[2],
			face.rotation[3]
		);
		
		//aanmaken verplaats-draai-vector: fotovlak op de oorsprong 0,0,0 draaien waarbij het fotovlak een halve kubus maat verplaatst is
		const offset = new THREE.Vector3(0,0,-size/2);
		offset.applyQuaternion(faceQuaternionE57);
		
		//verplaatsing en draaiing overnemen van offset vector
		mesh.position.copy(offset);
		mesh.quaternion.copy(faceQuaternionE57);

        cube.add(mesh);

    });

	// oplossen right-handed-rule + y-up vs z-up
	cube.rotation.x = -Math.PI / 2;
	cube.rotation.z = Math.PI; 

	// kubus van oorsprong naar rel. positie tov andere panorama's
    cube.position.set(
		pano.position.x,
        pano.position.z,
        pano.position.y
    );

    return cube;
}

    scene.add(cube);

//////////////////////////////////////////////////////////////////////////////
// TARGETS AANMAKEN EN AAN DE KUBUSSEN KOPPELEN
//////////////////////////////////////////////////////////////////////////////

function createLinks(){

    panoramas.forEach(source=>{

        const sourceCube =
            cubes[source.id];

        panoramas.forEach(target=>{

            if(source.id === target.id)
                return;

            const hotspot =
                createHotspot(
                    target.id
                );
			
			const targetCube = cubes[target.id];
	
			const sourceWorld = new THREE.Vector3();
			const targetWorld = new THREE.Vector3();

			sourceCube.getWorldPosition(sourceWorld);
			targetCube.getWorldPosition(targetWorld);

			const direction = targetWorld
				.clone()
				.sub(sourceWorld)
				.normalize();
				
			const worldPoint = sourceWorld
				.clone()
				.add(direction.multiplyScalar(KubusMaat/2.1)); //2.1 zodat de targets zeker binnen in de kubus vallen

			const localPoint = sourceCube.worldToLocal(
				worldPoint.clone()
			);

			hotspot.position.copy(localPoint);
			//-------------------------------------------
			
            sourceCube.add(
                hotspot
            );
        });
    });
}

scene.updateMatrixWorld(true);
createLinks();

//////////////////////////////////////////////////////////////////////////////

let activePano =
    cubes["panorama1"];

camera.position.copy(
    activePano.position
);

//////////////////////////////////////////////////////////////////////////////
// RAYCASTER
//////////////////////////////////////////////////////////////////////////////

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

window.addEventListener(
    "click",
    event=>{

        mouse.x =
            (event.clientX / window.innerWidth) * 2 - 1;

        mouse.y =
            -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(
            mouse,
            camera
        );

        const hits =
            raycaster.intersectObjects(
                scene.children,
                true
            );

        for(const hit of hits){

            if(hit.object.userData.targetId){

                const target =
                    cubes[
                        hit.object.userData.targetId
                    ];
				
				Object.values(cubes).forEach(cube => {
					cube.visible = false;
				});

                activePano = target;

				activePano.visible = true;
				
				camera.position.copy(
					activePano.position
				);
						
                break;
            }
        }

    }
);

// RESIZE
//////////////////////////////////////////////////////////////////////////////

window.addEventListener(
    'resize',
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

//////////////////////////////////////////////////////////////////////////////
// ANIMATE
//////////////////////////////////////////////////////////////////////////////

function animate(){

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );
}

animate();
